name: Flutter Android release

on:
  push:
    branches: [master, release]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.2"
          cache: true

      - name: Set release version
        run: |
          set -euo pipefail
          sed -i -E "s/^version: .*/version: 1.0.${GITHUB_RUN_NUMBER}+${GITHUB_RUN_NUMBER}/" pubspec.yaml
          grep '^version:' pubspec.yaml

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Test
        run: flutter test --no-pub

      - name: Validate release secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          for variable_name in \
            KEYSTORE_BASE64 \
            KEY_STORE_PASSWORD \
            KEY_PASSWORD \
            KEY_ALIAS \
            SUPABASE_URL \
            SUPABASE_ANON_KEY; do
            if [[ -z "${!variable_name//[[:space:]]/}" ]]; then
              echo "Missing or blank secret: ${variable_name}" >&2
              exit 1
            fi
          done
          if [[ ! "$SUPABASE_URL" =~ ^https://[^[:space:]]+$ ]]; then
            echo "SUPABASE_URL must be a valid HTTPS URL." >&2
            exit 1
          fi

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          printf '%s\n' \
            "storePassword=$KEY_STORE_PASSWORD" \
            "keyPassword=$KEY_PASSWORD" \
            "keyAlias=$KEY_ALIAS" \
            "storeFile=upload-keystore.jks" > android/key.properties
          keytool -list \
            -keystore android/app/upload-keystore.jks \
            -storepass "$KEY_STORE_PASSWORD" \
            -alias "$KEY_ALIAS" > /dev/null

      - name: Build signed APK and AAB
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_REDIRECT_URL: com.innocentree.pumpingday://login-callback/
        run: |
          set -euo pipefail
          flutter build apk --release --no-pub \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=SUPABASE_REDIRECT_URL="$SUPABASE_REDIRECT_URL"
          flutter build appbundle --release --no-pub \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=SUPABASE_REDIRECT_URL="$SUPABASE_REDIRECT_URL"

      - name: Validate Android App Bundle
        env:
          BUNDLETOOL_VERSION: 1.18.1
          BUNDLETOOL_SHA256: 675786493983787ffa11550bdb7c0715679a44e1643f3ff980a529e9c822595c
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar" \
            --output bundletool.jar
          echo "${BUNDLETOOL_SHA256}  bundletool.jar" | sha256sum --check --strict
          java -jar bundletool.jar validate \
            --bundle=build/app/outputs/bundle/release/app-release.aab
          java -jar bundletool.jar dump config \
            --bundle=build/app/outputs/bundle/release/app-release.aab \
            > build/app/outputs/bundle/release/bundle-config.txt
          grep -q 'PAGE_ALIGNMENT_16K' build/app/outputs/bundle/release/bundle-config.txt

      - name: Create release checksums
        run: |
          set -euo pipefail
          (
            cd build/app/outputs/flutter-apk
            sha256sum app-release.apk
            cd ../bundle/release
            sha256sum app-release.aab
          ) > build/app/outputs/release-sha256.txt
          cat build/app/outputs/release-sha256.txt

      - name: Create and upload GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Release 1.0.${{ github.run_number }}
          body_path: commit_message.txt
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/release-sha256.txt
          draft: false
          prerelease: false
